#!/usr/bin/env bash

# =============================================================================
# fetchly - Setup and Deployment
# =============================================================================
apt-get update
apt-get install -y \
    build-essential \
    ca-certificates \
    ffmpeg \
    git \
    python3.13-dev \
    python3.13-venv

PYTHON=python3.13
command -v "$PYTHON" >/dev/null 2>&1 || {
    printf '%s\n' 'Python 3.13 is required but was not found.' >&2
    exit 1
}

"$PYTHON" -m venv /opt/fetchly/.venv
source /opt/fetchly/.venv/bin/activate
    
$PYTHON -m pip install --upgrade pip
$PYTHON -m pip install -r /opt/fetchly/requirements.txt
$PYTHON -m pip install --upgrade "yt-dlp==2026.8.19" yt-dlp-ejs
$PYTHON -m yt_dlp --version


# --- Start development server ---
export LOG_LEVEL="DEBUG"
export TZ="Europe/Berlin"
export UVICORN_RELOAD="1"
# Uvicorn treats reload exclusions as paths/globs relative to the working directory.
export UVICORN_RELOAD_EXCLUDES="data,.git"
export UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN="10"
export FETCHLY_SECRET_KEY="l+QGUq6BH9dLZkAQpG2jivXZeLLwYNMCmzUsfcD2wPM="
cd /opt/fetchly && source .venv/bin/activate && python run.py


# --- Restart Docker without building ---
docker compose down && docker compose pull && docker compose up -d


# --- Build and push image ---
cd /opt/fetchly && \
VERSION="$(tr -d '\r\n' < VERSION)" && \
GIT_SHA="$(git rev-parse HEAD)" && \
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
printf '%s\n' "$GIT_SHA" > BUILD_INFO && \
docker buildx build \
  --platform linux/amd64 \
  -f docker/Dockerfile \
  --build-arg APP_VERSION="$VERSION" \
  --build-arg GIT_SHA="$GIT_SHA" \
  --build-arg BUILD_DATE="$BUILD_DATE" \
  -t "docker.cirrio.de/fetchly:${VERSION}" \
  -t "docker.cirrio.de/fetchly:latest" \
  --push .


# --- Prune unused Docker data ---
docker system prune -af
docker buildx prune -af


# --- Run design lint ---
cd /opt/fetchly/tools/ui-lint
UI_LINT_BASE_URL=http://localhost:8000 \
UI_LINT_USERNAME=admin \
UI_LINT_PASSWORD=admin \
npm run audit


# --- Create Changelog ---
Vergleiche die Commits seit dem letzten Release-Tag (v1.1.0) mit dem aktuellen Feature Branch und erstelle/aktualisiere die /opt/fetchly/CHANGELOG.md in englischer Sprache. Nutze dafür u.a. Commit Messages und Code Diff, um die Änderungen zu analysieren. Formuliere die Changelog kompakt und nur das Wichtigste aus Sicht eines Endbenutzers.
Unterteile zwischen "New" und "Fix" sowie "Security". "New" Punkte immer als Erstes auflisten. Halte Dich kompakt.


# --- Squash Commit ---
Führe die Änderungen des Feature-Branches per Squash-Merge in main zusammen und erstelle dafür einen neuen Commit. Erstelle auf diesem aktuellen main-Commit den Tag v1.1.1 und pushe main sowie den Tag. Sollte der neue Tag fehlen, erstelle ihn zuvor. Lösche anschließend den Feature-Branch lokal und remote. Achte darauf, dass in der Commit-Message "Release v1.1.1" steht (keine autogenerated Message).