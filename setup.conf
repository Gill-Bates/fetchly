#!/usr/bin/env bash

# =============================================================================
# fetchly - Setup and Deployment
# =============================================================================
apt-get update
apt-get install -y \
    build-essential \
    ca-certificates \
    ffmpeg \
    git \
    python3.13-dev \
    python3.13-venv

PYTHON=python3.13
command -v "$PYTHON" >/dev/null 2>&1 || {
    printf '%s\n' 'Python 3.13 is required but was not found.' >&2
    exit 1
}

"$PYTHON" -m venv /opt/fetchly/.venv
source /opt/fetchly/.venv/bin/activate

python -m pip install --upgrade pip
# pyproject.toml is the single manifest; --extra-index-url picks the CPU torch
# build so beat-this does not drag in the CUDA wheels.
python -m pip install \
    --extra-index-url https://download.pytorch.org/whl/cpu \
    -e "/opt/fetchly[dev]"
python -m pip install --upgrade "yt-dlp==2026.8.19" yt-dlp-ejs
python -m yt_dlp --version


# --- Start development server ---
export LOG_LEVEL="DEBUG"
export TZ="Europe/Berlin"
export UVICORN_RELOAD="1"
# Uvicorn treats reload exclusions as paths/globs relative to the working directory.
export UVICORN_RELOAD_EXCLUDES="data,.git"
export UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN="10"
export FETCHLY_SECRET_KEY="l+QGUq6BH9dLZkAQpG2jivXZeLLwYNMCmzUsfcD2wPM="
cd /opt/fetchly && source .venv/bin/activate && python run.py


# --- Restart Docker without building ---
docker compose down && docker compose pull && docker compose up -d


# --- Build and push image (with BuildKit caching) ---
docker buildx build \
    --pull \
    --platform linux/amd64 \
    --target runtime \
    -f docker/Dockerfile \
    --build-arg "APT_CACHE_DATE=$(date -u +%Y-%m-%d)" \
    --label "org.opencontainers.image.version=${VERSION}" \
    --label "org.opencontainers.image.revision=${GIT_SHA}" \
    --label "org.opencontainers.image.created=${BUILD_DATE}" \
    "${CACHE_ARGS[@]}" \
    --cache-to "type=local,dest=${CACHE_DIR},mode=max,reset=true" \
    -t "docker.cirrio.de/fetchly:${VERSION}" \
    -t "docker.cirrio.de/fetchly:latest" \
    --push \
    .


# --- Prune unused Docker data ---
docker system prune -af
docker buildx prune -af


# --- Install front-end lint + UI-lint toolchain ---
cd /opt/fetchly
npm install                 # root: eslint, stylelint, the node --test runner
npm run ui-lint:install     # tools/ui-lint deps + Playwright engines (chromium, webkit, firefox)

# --- Run front-end unit tests + linters ---
cd /opt/fetchly
npm test
npm run lint                # eslint + stylelint + the source-level UI contracts

# The contract half of the design lint on its own: regex over jobs.js, main.js,
# ui.js, settings.js and the settings template. No browser, no server, no login,
# so it also runs in ci.yml. `npm run lint` already includes it.
npm run lint:contracts


# --- Run design lint ---
cd /opt/fetchly
rm -f audit.log && \
UI_LINT_BASE_URL=http://localhost:8000 \
UI_LINT_USERNAME=admin \
UI_LINT_PASSWORD=admin \
UI_LINT_BROWSERS=chromium,webkit,firefox \
UI_LINT_BROWSER_CONCURRENCY=2 \
UI_LINT_DEVICE_CONCURRENCY=2 \
npm run ui-lint 2>&1 | tee audit.log

# --- Read the result ---
grep -E '^(PASS|FAIL|SKIP|Totals|UI health)' audit.log   # one line per view
grep 'hard:' audit.log                                   # the failures themselves


# --- Create Changelog ---
Vergleiche die Commits seit dem letzten Release-Tag (z. B. v1.2.2) mit dem aktuellen Feature-Branch und erstelle/aktualisiere die /opt/fetchly/CHANGELOG.md in englischer Sprache. Nutze dafür Commit-Messages und Code-Diff, um die Änderungen zu analysieren. Formuliere die Changelog kompakt und stichpunktartig - pro Punkt maximal 1-2 Sätze, nur das Wichtigste aus Sicht eines Endbenutzers.
Unterteile zwischen "New", "Fix" und "Security". "New" Punkte immer als Erstes auflisten. Fokussiere Dich ausschliesslich auf funktionale Änderungen; Design-Änderungen und rein interne Arbeit (Refactorings, Tests) werden weggelassen.

Prüfe, ob die Dokumentation sowie die beiden README-Dateien den aktuellen Stand entsprechen. Achte darauf, dass die Inhalte in englischer Sprache vorliegen.

# --- Squash Commit ---
Squash-merge all commits into main, create a new tag, tag it as v1.3.0, and push the tag. Use as commit Message "Release (x.xx)" (Replace x.xx by using the real Version Number).Then delete the feature branch locally and remotely.

# --- Commit ---
Erstelle eine Commit Message auf Basis der Änderungen auf Englisch und comitte den aktuellen Stand in das Repo. Aber pushe nicht!