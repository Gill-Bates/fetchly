#!/usr/bin/env bash

# =============================================================================
# tubeyou - Setup and Deployment
# =============================================================================
apt-get update
apt-get install -y \
    build-essential \
    ca-certificates \
    ffmpeg \
    git \
    python3.13-dev \
    python3.13-venv

PYTHON=python3.13
command -v "$PYTHON" >/dev/null 2>&1 || {
    printf '%s\n' 'Python 3.13 is required but was not found.' >&2
    exit 1
}

"$PYTHON" -m venv /opt/tubeyou/.venv
source /opt/tubeyou/.venv/bin/activate
python -m pip install --upgrade pip
python -m pip install -r /opt/tubeyou/requirements.txt
python -m pip install --upgrade "yt-dlp==2026.8.19" yt-dlp-ejs
python -m yt_dlp --version


# --- Start development server ---
export LOG_LEVEL="DEBUG"
export TZ="Europe/Berlin"
export UVICORN_RELOAD="1"
export UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN="10"
export TUBEYOU_SECRET_KEY="l+QGUq6BH9dLZkAQpG2jivXZeLLwYNMCmzUsfcD2wPM="
export TUBEYOU_ADMIN_PASSWORD="admin"
cd /opt/tubeyou && source .venv/bin/activate && python run.py


# --- Restart Docker without building ---
docker compose down && docker compose pull && docker compose up -d


# --- Build and push image ---
cd /opt/tubeyou && \
VERSION="$(tr -d '\r\n' < VERSION)" && \
GIT_SHA="$(git rev-parse HEAD)" && \
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
printf '%s\n' "$GIT_SHA" > BUILD_INFO && \
docker buildx build \
  --platform linux/amd64 \
  -f docker/Dockerfile \
  --build-arg APP_VERSION="$VERSION" \
  --build-arg GIT_SHA="$GIT_SHA" \
  --build-arg BUILD_DATE="$BUILD_DATE" \
  -t "docker.cirrio.de/tubeyou:${VERSION}" \
  -t "docker.cirrio.de/tubeyou:latest" \
  --push .


# --- Re-run pipeline ---
TAG_NAME="v1.3"
git tag -d "$TAG_NAME"
git push origin ":refs/tags/$TAG_NAME"
git tag -a "$TAG_NAME" -m "$TAG_NAME" HEAD
git push origin "$TAG_NAME"


# --- Prune unused Docker data ---
docker system prune -af
docker buildx prune -af


# --- Run design lint ---
cd /opt/tubeyou/tools/ui-lint
UI_LINT_BASE_URL=http://localhost:8000 \
UI_LINT_USERNAME=admin \
UI_LINT_PASSWORD=admin \
npm run audit
