# =============================================================================
# tubeyou - Setup & Deployment
# =============================================================================

# --- Voraussetzungen (einmalig) ---
# yt-dlp und ffmpeg werden im Container installiert.
# Lokal werden sie nur für direkte Tests benötigt:
#   sudo apt-get install ffmpeg
#   sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
#       -o /usr/local/bin/yt-dlp && sudo chmod a+rx /usr/local/bin/yt-dlp


# --- Local Development Setup ---
command -v python3.13 >/dev/null 2>&1 && PYTHON=python3.13 || PYTHON=python3
$PYTHON -m venv /opt/tubeyou/.venv
source /opt/tubeyou/.venv/bin/activate
pip install --upgrade pip
pip install -r /opt/tubeyou/requirements.txt


# --- Dev Server starten ---
export LOG_LEVEL="DEBUG"
export TZ="Europe/Berlin"
export UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN="10"
export TUBEYOU_SECRET_KEY="l+QGUq6BH9dLZkAQpG2jivXZeLLwYNMCmzUsfcD2wPM=" # Generate with: head -c 32 /dev/urandom | base64
export TUBEYOU_ADMIN_PASSWORD="admin"
cd /opt/tubeyou && source .venv/bin/activate && python run.py


# --- Docker: Neu starten ohne Build ---
docker compose down && docker compose pull && docker compose up -d


# --- Build & Push Image ---
cd /opt/tubeyou && \
VERSION="$(tr -d '\r\n' < VERSION)" && \
GIT_SHA="$(git rev-parse HEAD)" && \
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
printf '%s\n' "$GIT_SHA" > BUILD_INFO && \
docker buildx build \
  --platform linux/amd64 \
  -f docker/Dockerfile \
  --build-arg APP_VERSION="$VERSION" \
  --build-arg GIT_SHA="$GIT_SHA" \
  --build-arg BUILD_DATE="$BUILD_DATE" \
  -t "docker.cirrio.de/tubeyou:${VERSION}" \
  -t "docker.cirrio.de/tubeyou:latest" \
  --push .


# --- Re-Run Pipeline ---
git tag -d v0.1
git push origin :refs/tags/v0.1
git tag -a v0.1 -m "v0.1" HEAD
git push origin v0.1


# --- Prune ---
docker system prune -af
docker buildx prune -af


# Design Lint
cd /opt/tubeyou/tools/ui-lint
UI_LINT_BASE_URL=http://localhost:8000 \
UI_LINT_USERNAME=admin \
UI_LINT_PASSWORD=admin \
npm run audit

Mache ein Squash Merge aller Commits nach main, erstelle einen neuen tag und tagge auf v1.2 und pushe den Tag. Danach löscht du den Feature-Branch lokal und remote.