#!/usr/bin/env bash

# =============================================================================
# fetchly - Setup and Deployment
# =============================================================================
apt-get update
apt-get install -y \
    build-essential \
    ca-certificates \
    ffmpeg \
    git \
    python3.13-dev \
    python3.13-venv

PYTHON=python3.13
command -v "$PYTHON" >/dev/null 2>&1 || {
    printf '%s\n' 'Python 3.13 is required but was not found.' >&2
    exit 1
}

"$PYTHON" -m venv /opt/fetchly/.venv
source /opt/fetchly/.venv/bin/activate
    
$PYTHON -m pip install --upgrade pip
# pyproject.toml is the single manifest; --extra-index-url picks the CPU torch
# build so beat-this does not drag in the CUDA wheels.
$PYTHON -m pip install \
    --extra-index-url https://download.pytorch.org/whl/cpu \
    -e "/opt/fetchly[dev]"
$PYTHON -m pip install --upgrade "yt-dlp==2026.8.19" yt-dlp-ejs
$PYTHON -m yt_dlp --version


# --- Start development server ---
export LOG_LEVEL="DEBUG"
export TZ="Europe/Berlin"
export UVICORN_RELOAD="1"
# Uvicorn treats reload exclusions as paths/globs relative to the working directory.
export UVICORN_RELOAD_EXCLUDES="data,.git"
export UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN="10"
export FETCHLY_SECRET_KEY="l+QGUq6BH9dLZkAQpG2jivXZeLLwYNMCmzUsfcD2wPM="
cd /opt/fetchly && source .venv/bin/activate && python run.py


# --- Restart Docker without building ---
docker compose down && docker compose pull && docker compose up -d


# --- Build and push image ---
cd /opt/fetchly && \
VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" && \
GIT_SHA="$(git rev-parse HEAD)" && \
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
printf '%s\n' "$GIT_SHA" > BUILD_INFO && \
docker buildx build \
  --platform linux/amd64 \
  -f docker/Dockerfile \
  --build-arg APP_VERSION="$VERSION" \
  --build-arg GIT_SHA="$GIT_SHA" \
  --build-arg BUILD_DATE="$BUILD_DATE" \
  -t "docker.cirrio.de/fetchly:${VERSION}" \
  -t "docker.cirrio.de/fetchly:latest" \
  --push .


# --- Prune unused Docker data ---
docker system prune -af
docker buildx prune -af


# --- Run design lint ---
# Needs the three browser engines once: npm run ui-lint:install
# An engine that is not installed is skipped with a reason, not a crash.
cd /opt/fetchly/tools/ui-lint
UI_LINT_BASE_URL=http://localhost:8000 \
UI_LINT_USERNAME=admin \
UI_LINT_PASSWORD=admin \
UI_LINT_BROWSERS=chromium,webkit,firefox \
UI_LINT_BROWSER_CONCURRENCY=3 \
UI_LINT_DEVICE_CONCURRENCY=2 \
npm run audit

# Report-only knobs, both off by default:
#   UI_LINT_HEALTH_MIN=80   fail any view scoring below 80
#   UI_LINT_HEALTH_GATE=1   fail on critical UX / blocking axe findings
#   UI_LINT_AXE_FAIL_ON=serious|none  widen or disable the axe gate
#   UI_LINT_AXE=0           skip the accessibility pass entirely


# --- Create Changelog ---
Vergleiche die Commits seit dem letzten Release-Tag (z. B. v1.2.0) mit dem aktuellen Feature-Branch und erstelle/aktualisiere die /opt/fetchly/CHANGELOG.md in englischer Sprache. Nutze dafür Commit-Messages und Code-Diff, um die Änderungen zu analysieren. Formuliere die Changelog kompakt und stichpunktartig - pro Punkt maximal 1-2 Sätze, nur das Wichtigste aus Sicht eines Endbenutzers.
Unterteile zwischen "New", "Fix" und "Security". "New" Punkte immer als Erstes auflisten. Fokussiere Dich ausschliesslich auf funktionale Änderungen; Design-Änderungen und rein interne Arbeit (Refactorings, Tests) werden weggelassen.

Prüfe, ob die Dokumentation sowie die beiden README-Dateien den aktuellen Stand entsprechen. Achte darauf, dass die Inhalte in englischer Sprache vorliegen.

# --- Squash Commit ---
Führe die Änderungen des Feature-Branches per Squash-Merge in main zusammen und erstelle dafür einen neuen Commit. Erstelle auf diesem aktuellen main-Commit den Tag v1.2.1 und pushe main sowie den Tag. Sollte der neue Tag fehlen, erstelle ihn zuvor. Lösche anschließend den Feature-Branch lokal und remote. Achte darauf, dass in der Commit-Message "Release v1.2.1" steht (keine autogenerated Message).