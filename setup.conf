# =============================================================================
# tubeyou - Setup & Deployment
# =============================================================================

# --- Voraussetzungen (einmalig) ---
# yt-dlp und ffmpeg werden im Container installiert.
# Lokal werden sie nur für direkte Tests benötigt:
#   sudo apt-get install ffmpeg
#   sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
#       -o /usr/local/bin/yt-dlp && sudo chmod a+rx /usr/local/bin/yt-dlp

# --- Local Development Setup ---
{ command -v python3.13 >/dev/null 2>&1 && PYTHON=python3.13; } || \
{ command -v python3.12 >/dev/null 2>&1 && PYTHON=python3.12; } || \
{ command -v python3.11 >/dev/null 2>&1 && PYTHON=python3.11; } || \
PYTHON=python3 && \
$PYTHON -m venv /opt/tubeyou/.venv && \
source /opt/tubeyou/.venv/bin/activate && \
pip install --upgrade pip && \
pip install -r /opt/tubeyou/requirements.txt

# --- Dev Server starten ---
export LOG_LEVEL="DEBUG"
export TZ="Europe/Berlin"
export TUBEYOU_SECRET_KEY="l+QGUq6BH9dLZkAQpG2jivXZeLLwYNMCmzUsfcD2wPM=" # Generate with: head -c 32 /dev/urandom | base64
export TUBEYOU_ADMIN_PASSWORD="admin"
cd /opt/tubeyou && source .venv/bin/activate && python run.py

# --- Download-Verzeichnis anlegen ---
mkdir -p /opt/tubeyou/data

# --- Docker: Lokaler Build & Start ---
cd /opt/tubeyou && docker compose up --build

# --- Docker: Neu starten ohne Build ---
docker compose down && docker compose up -d

# --- Docker: Logs ansehen ---
docker compose logs -f

# --- Docker Login ---
docker login  # Docker Hub

# --- Build & Push Image ---
cd /opt/tubeyou && \
VERSION="$(cat VERSION | tr -d '\r\n')" && \
if [ -z "$VERSION" ]; then echo "VERSION is empty" >&2; exit 1; fi && \
git add -A && \
git commit -m "Build $VERSION" --allow-empty && \
git rev-parse HEAD > BUILD_INFO && \
docker buildx build --platform linux/amd64 \
  -f Dockerfile \
  -t "tubeyou:${VERSION}" \
  -t "tubeyou:latest" \
  --push .

# Kill Process
pkill -9 -f 'python run.py' 2>/dev/null; ss -tlnp | grep 8000 | awk '{print $NF}' | sed 's/.*pid=//; s/,.*//' | xargs -r kill -9 2>/dev/null; 


# --- Re-Run Pipeline ---
git tag -d v0.1
git push origin :refs/tags/v0.1
git tag -a v0.1 -m "v0.1" HEAD
git push origin v0.1

# --- Prune ---
docker system prune -af
docker buildx prune -af

# Code Review
Code Review mit Fokus auf:
- Performance
- DRY-Verstößen
- Race-Conditions/Bottlenecks/Memory Leaks
- Verstöße gegen Best-Practise
- ungesicherte APIs (kritische Endpunkte via SlowAPI geschützt)
- fehlerhaften deutschen Kommentaren (es muss alles auf Englisch im Code sein)
- konsequente Nutzung von Pythin 3.13+ Features
- Funktions Kommentare müssen dem Code entsprechen (kein Doku Drift)

# Squash Merge & Tag
Mache ein Squash Merge aller Commits nach main, tagge auf v0.2 und pushe den Tag. Danach löscht du den Feature-Branch lokal und remote.