site_name: fetchly Documentation
site_description: Self-hosted media downloader for YouTube, TikTok, Instagram & Facebook
site_author: Gill-Bates
site_url: https://gill-bates.github.io/fetchly/

repo_name: Gill-Bates/fetchly
repo_url: https://github.com/Gill-Bates/fetchly
edit_uri: edit/main/docs/

docs_dir: .
site_dir: ../site

# SEO and canonical URL configuration
use_directory_urls: true

# The AGENTS.md files scattered through docs/ are internal contributor
# guidance, not user documentation. With docs_dir: . they sit inside the
# documentation root, so MkDocs would otherwise render and publish every one
# of them (docs/AGENTS.md became /AGENTS/, docs/api/AGENTS.md became
# /api/AGENTS/, ...). The pattern is gitignore-style and matches at any depth.
exclude_docs: |
  AGENTS.md

# --strict promotes warnings to errors, but broken heading anchors are only
# reported at INFO by default, so a link to page.md#no-such-heading would pass
# an otherwise strict build. Raising them to warnings makes --strict catch them.
validation:
  links:
    anchors: warn

theme:
  name: material
  language: en
  favicon: assets/favicon.svg
  palette:
    # Light mode — used when the OS prefers a light scheme. The `media` query
    # is what makes the theme follow the system setting on first visit; without
    # it Material always starts on the first palette regardless of the OS.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode — used when the OS prefers a dark scheme.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      # changelog.md and license.md are copied in at build time from
      # CHANGELOG.md / LICENSE, so their copied source paths carry no
      # meaningful Git revision history for that path (a first-revision date
      # newer than the last-revision one), which aborts `mkdocs build --strict`
      # (this plugin's own `strict` option also defaults to true). Excluding
      # them skips revision-date processing for both pages entirely.
      exclude:
        - changelog.md
        - license.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  homepage: https://gill-bates.github.io/fetchly/
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Gill-Bates
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/giiibates/fetchly

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: getting-started/quick-start.md
    - Installation: getting-started/installation.md
    - First Steps: getting-started/first-steps.md
    - Docker Setup: getting-started/docker.md
  - Features:
    - Downloads: features/downloads.md
    - Video Codecs: features/video-codecs.md
    - Job Dashboard: features/jobs.md
    - Audio Trimming: features/trimming.md
    - BPM Analysis: features/bpm.md
    - Stem Separation: features/stems.md
    - Share Links: features/sharing.md
    - Platform Cookies: features/cookies.md
  - Configuration:
    - Environment Variables: configuration/environment.md
    - Application Settings: configuration/settings.md
    - Resources & Workers: configuration/resources.md
    - Reverse Proxy: configuration/reverse-proxy.md
    - Storage & Retention: configuration/storage.md
  - Security:
    - Overview: security/overview.md
    - Authentication: security/authentication.md
    - Anti-Bot Protection: security/anti-bot.md
    - Rate Limiting: security/rate-limiting.md
    - Best Practices: security/best-practices.md
  - API Reference:
    - Overview: api/overview.md
    - Authentication: api/authentication.md
    - Endpoints: api/endpoints.md
  - Development:
    - Setup: development/setup.md
    - Architecture: development/architecture.md
    - Contributing: development/contributing.md
  - Troubleshooting: troubleshooting.md
  # Copied in by the docs workflow from CHANGELOG.md / LICENSE before the
  # build. Without these entries both pages are built but unreachable: nothing
  # in the site links to them.
  - Project:
    - Changelog: changelog.md
    - License: license.md

