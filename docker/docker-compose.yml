services:
  tubeyou:
    image: docker.cirrio.de/tubeyou:latest
    container_name: tubeyou
    restart: always
    stop_grace_period: 20s
    environment:
      LOG_LEVEL: DEBUG
      TZ: Europe/Berlin
      TUBEYOU_SECRET_KEY: "${TUBEYOU_SECRET_KEY}" # Generate with: head -c 32 /dev/urandom | base64
      TUBEYOU_ADMIN_PASSWORD: "${TUBEYOU_ADMIN_PASSWORD:-admin}"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
