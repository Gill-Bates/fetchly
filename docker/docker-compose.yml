# Set FETCHLY_SECRET_KEY in .env before starting Compose.
services:
  fetchly:
    image: giiibates/fetchly:${FETCHLY_TAG:-latest}
    container_name: fetchly
    restart: always
    stop_grace_period: 20s
    ports:
      - "${FETCHLY_BIND:-127.0.0.1}:${FETCHLY_PORT:-8000}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: Etc/UTC
      TIMEOUT: ${TIMEOUT:-60}
      FETCHLY_SECRET_KEY: "${FETCHLY_SECRET_KEY:?required - generate with openssl rand -base64 32}"
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    volumes:
      - ./data:/app/data
