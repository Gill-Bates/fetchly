<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token | e }}">
    <title>tubeyou Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/login.css" rel="stylesheet">
</head>
<body>
    <main class="login-shell">
        <section class="login-card">
            <h1>tubeyou</h1>
            <p class="subtitle">Log in to start downloading videos.</p>

            <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>

            <form id="login-form" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control form-control-lg" id="username" name="username" autocomplete="username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button id="submit-btn" type="submit" class="btn btn-primary btn-lg w-100">Log In</button>
            </form>
        </section>
    </main>
    <script src="/static/js/login.js?v=20260426" defer></script>
</body>
</html>
