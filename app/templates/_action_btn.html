{% if job["status"] == "done" %}
<a class="btn btn-download btn-sm" href="/download/{{ job["id"] }}" title="Download" aria-label="Download"><span class="material-symbols-outlined icon-inline">download</span></a>
{% else %}
<button class="btn btn-details btn-sm btn-outline-secondary" type="button" data-action="open-detail" data-job-id="{{ job["id"] }}" title="Details" aria-label="Details"><span class="material-symbols-outlined icon-inline">info</span></button>
{% endif %}
