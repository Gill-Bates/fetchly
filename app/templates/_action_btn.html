{% if job["status"] == "done" %}
<div class="action-buttons">
    {% if job["type"] == "audio" and lalal_enabled %}
    <div class="dropdown dropup">
        <button class="btn btn-outline-secondary btn-sm dropdown-toggle action-menu-toggle" type="button"
                data-bs-toggle="dropdown" aria-expanded="false" aria-label="Actions">
            <span class="material-symbols-outlined" aria-hidden="true">more_vert</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
            <li>
                <a class="dropdown-item" href="/download/{{ job["id"] }}">
                    <span class="material-symbols-outlined icon-inline" aria-hidden="true">download</span> Download
                </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
                <button class="dropdown-item" type="button"
                        data-action="lalal-split"
                        data-job-id="{{ job["id"] }}"
                        data-stem="instrumental">
                    <span class="material-symbols-outlined icon-inline" aria-hidden="true">music_off</span> Instrumental
                </button>
            </li>
            <li>
                <button class="dropdown-item" type="button"
                        data-action="lalal-split"
                        data-job-id="{{ job["id"] }}"
                        data-stem="vocals">
                    <span class="material-symbols-outlined icon-inline" aria-hidden="true">mic</span> A Cappella
                </button>
            </li>
        </ul>
    </div>
    {% else %}
    <a class="btn btn-primary btn-sm" href="/download/{{ job["id"] }}" title="Download" aria-label="Download"><span class="material-symbols-outlined">download</span></a>
    {% endif %}
</div>
{% elif job["status"] in ("queued", "processing", "downloading", "transcoding") %}
<div class="action-buttons">
    <button class="btn btn-danger btn-sm" type="button" data-action="cancel-job" data-job-id="{{ job["id"] }}" title="Cancel" aria-label="Cancel"><span class="material-symbols-outlined">cancel</span></button>
    <button class="btn btn-sm btn-outline-secondary" type="button" data-action="open-detail" data-job-id="{{ job["id"] }}" title="Details" aria-label="Details"><span class="material-symbols-outlined">info</span></button>
</div>
{% else %}
<div class="action-buttons">
    <button class="btn btn-sm btn-outline-secondary" type="button" data-action="open-detail" data-job-id="{{ job["id"] }}" title="Details" aria-label="Details"><span class="material-symbols-outlined">info</span></button>
</div>
{% endif %}
