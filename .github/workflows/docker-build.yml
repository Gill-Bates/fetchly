name: Docker Multi-Arch Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: docker.io

jobs:
  meta:
    name: Validate build metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build_date: ${{ steps.meta.outputs.build_date }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      is_newest: ${{ steps.newest.outputs.is_newest }}
      python_base: ${{ steps.rolling.outputs.python_base }}
      essentia_ref: ${{ steps.rolling.outputs.essentia_ref }}
      ffmpeg_release_url: ${{ steps.rolling.outputs.ffmpeg_release_url }}
      ffmpeg_series: ${{ steps.rolling.outputs.ffmpeg_series }}
      ytdlp_version: ${{ steps.rolling.outputs.ytdlp_version }}
      ytdlp_ejs_version: ${{ steps.rolling.outputs.ytdlp_ejs_version }}
      deno_version: ${{ steps.rolling.outputs.deno_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?Missing DOCKERHUB_USERNAME secret}"
          : "${DOCKERHUB_TOKEN:?Missing DOCKERHUB_TOKEN secret}"

      - name: Validate and set build metadata
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          if ! echo "$DOCKERHUB_USERNAME" | grep -qE '^[a-z0-9][a-z0-9_-]{2,}$'; then
            echo "ERROR: Invalid Docker Hub username/namespace: '$DOCKERHUB_USERNAME'"
            exit 1
          fi

          if [ ! -f pyproject.toml ]; then
            echo "ERROR: pyproject.toml not found"
            exit 1
          fi

          # pyproject.toml [project] version is the single source of truth -
          # app/utils/version.py reads the same key at runtime.
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])' | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "ERROR: pyproject.toml has no [project] version"
            exit 1
          fi

          # fetchly versions its releases MAJOR.MINOR (pyproject.toml currently
          # reads "1.5", tags run v0.1 .. v1.4), so the patch component is
          # optional here rather than required as in a strict semver check. A
          # prerelease suffix (1.6-rc.1) stays supported and still suppresses
          # 'latest'.
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "ERROR: Invalid version format: '$VERSION' (expected: X.Y, X.Y.Z or either with -suffix)"
            exit 1
          fi

          # A release must always run from the v<VERSION> tag. Without this
          # check a manual run on a branch could republish an existing
          # ${VERSION} image from a different commit and move 'latest' with it.
          # Re-runs are still possible: pick the tag as the ref when
          # dispatching manually.
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "ERROR: This workflow must run from a tag, but ref '${GITHUB_REF_NAME}' is a ${GITHUB_REF_TYPE}."
            echo "Push tag v${VERSION}, or re-run this workflow selecting that tag as the ref."
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "ERROR: Git tag (${GITHUB_REF_NAME}) does not match pyproject.toml version (${VERSION})"
            exit 1
          fi

          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          TAG="v${VERSION}"

          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Everything the Dockerfile deliberately leaves rolling is resolved here,
      # once, and handed to every architecture as a build arg.
      #
      # The Dockerfile's defaults each mean "whatever is newest at the moment
      # this layer runs": the python base tag, essentia's master branch, BtbN's
      # 'latest' ffmpeg release, yt-dlp and yt-dlp-ejs unpinned, and deno's
      # release-latest.txt. That is the intent for a release - but the amd64
      # and arm64 jobs are separate runners that reach those layers minutes
      # apart, so each would resolve "newest" on its own. A yt-dlp release, an
      # essentia commit or a nightly ffmpeg rebuild landing in that window
      # would put different toolchains in the two halves of one manifest.
      #
      # Resolving once and pinning only for the duration of the build keeps
      # both properties: the release still picks up the current stable of
      # everything, and both images contain identical versions of it.
      - name: Resolve rolling toolchain versions
        id: rolling
        env:
          # Only used to read another repository's public release list at the
          # authenticated API rate limit; unauthenticated calls share a 60/hour
          # budget with every other job on the runner's IP.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The base image by digest, so both architectures build on the same
          # multi-arch index even if a new python:3.13-slim is pushed mid-run.
          python_base="python:3.13-slim"
          digest="$(docker buildx imagetools inspect "$python_base" \
            --format '{{.Manifest.Digest}}')"
          case "$digest" in
            sha256:*) ;;
            *) echo "ERROR: could not resolve a digest for ${python_base}"; exit 1 ;;
          esac
          python_base="python:3.13-slim@${digest}"

          # essentia master -> one commit SHA. docker/Dockerfile compiles it on
          # both architectures, so this is the single value that decides which
          # essentia the release ships.
          essentia_ref="$(git ls-remote https://github.com/MTG/essentia.git refs/heads/master | cut -f1)"
          if [[ ! "$essentia_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: could not resolve MTG/essentia master (got '${essentia_ref}')"
            exit 1
          fi

          # ffmpeg comes from BtbN's builds, and the release the Dockerfile
          # defaults to - the one tagged 'latest' - is a rolling tag: every
          # nightly rebuild replaces its assets under unchanged file names.
          # Resolving only the series from it is not enough, because the two
          # architecture jobs download the tarball itself minutes apart. The
          # newest dated autobuild-* release carries the same builds and its
          # assets are immutable, so both architectures get one ffmpeg.
          #
          # The candidates are walked newest first: an autobuild whose assets
          # are incomplete - a build that failed for one architecture - is
          # skipped rather than published as half a release.
          ffmpeg_release_base="https://github.com/BtbN/FFmpeg-Builds/releases/download"
          ffmpeg_release_url=""
          ffmpeg_series=""
          series_for() {
            awk '{print $2}' checksums.sha256 \
              | sed -n "s/^ffmpeg-n.*-$1-gpl-\([0-9][0-9.]*\)\.tar\.xz$/\1/p" \
              | sort -u
          }
          while read -r release_tag; do
            if ! curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 \
              -o checksums.sha256 \
              "${ffmpeg_release_base}/${release_tag}/checksums.sha256"; then
              echo "  ${release_tag}: no checksums.sha256, skipping"
              continue
            fi
            # Only a series built for both architectures qualifies, chosen with
            # the same rule docker/Dockerfile applies when FFMPEG_SERIES is
            # empty - here once rather than per architecture.
            ffmpeg_series="$(comm -12 <(series_for linux64) <(series_for linuxarm64) \
              | sort -V | tail -n 1)"
            if [[ -z "$ffmpeg_series" ]]; then
              echo "  ${release_tag}: no stable series built for both architectures, skipping"
              continue
            fi
            ffmpeg_release_url="${ffmpeg_release_base}/${release_tag}"
            break
          done < <(
            curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/repos/BtbN/FFmpeg-Builds/releases?per_page=20' \
            | jq -r '.[] | select(.draft == false) | .tag_name | select(startswith("autobuild-"))'
          )
          if [[ -z "$ffmpeg_release_url" ]]; then
            echo "ERROR: no usable BtbN autobuild release found"
            exit 1
          fi

          # yt-dlp and yt-dlp-ejs are installed unpinned by the Dockerfile.
          # Resolve the current release of each and hand it over as the exact
          # '==<version>' specifier the YTDLP_* args expect.
          ytdlp_version="$(curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 \
            https://pypi.org/pypi/yt-dlp/json | jq -r '.info.version')"
          ytdlp_ejs_version="$(curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 \
            https://pypi.org/pypi/yt-dlp-ejs/json | jq -r '.info.version')"
          for v in "$ytdlp_version" "$ytdlp_ejs_version"; do
            if [[ -z "$v" || "$v" == "null" ]]; then
              echo "ERROR: could not resolve a yt-dlp / yt-dlp-ejs version from PyPI"
              exit 1
            fi
          done

          deno_version="$(curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 \
            https://dl.deno.land/release-latest.txt | tr -d ' \t\r\n')"
          if [[ -z "$deno_version" ]]; then
            echo "ERROR: could not resolve the latest deno release"
            exit 1
          fi

          {
            echo "python_base=${python_base}"
            echo "essentia_ref=${essentia_ref}"
            echo "ffmpeg_release_url=${ffmpeg_release_url}"
            echo "ffmpeg_series=${ffmpeg_series}"
            echo "ytdlp_version===${ytdlp_version}"
            echo "ytdlp_ejs_version===${ytdlp_ejs_version}"
            echo "deno_version=${deno_version}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved once for every architecture:"
          echo "  python base : ${python_base}"
          echo "  essentia    : ${essentia_ref}"
          echo "  ffmpeg      : n${ffmpeg_series} from ${ffmpeg_release_url}"
          echo "  yt-dlp      : ${ytdlp_version}"
          echo "  yt-dlp-ejs  : ${ytdlp_ejs_version}"
          echo "  deno        : ${deno_version}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # The interpreter the resolution below targets, and the same one
          # ARG PYTHON_BASE=python:3.13-slim carries.
          python-version: '3.13'

      # pyproject.toml pins none of the application's dependencies, so "newest"
      # has to be decided once per release rather than twice by two runners
      # reaching their pip layer minutes apart. This resolves the full
      # transitive set and hands it to every architecture build as a pip
      # constraints file, which is also what keeps their layer caches keyed on
      # the same versions instead of one arch reusing an older resolution.
      #
      # Resolving for both target platforms is the earliest point at which "both
      # images carry the same versions" can be established or refuted: if one
      # architecture has no wheel for the version the other would take, no build
      # arg can reconcile that later, and the release stops here with the
      # conflict in the log rather than after two hours of compiling.
      - name: Resolve runtime dependency versions
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip uv

          # essentia is compiled from source on every architecture and its
          # requirement line never reaches pip (see docker/Dockerfile), so
          # resolving it here would pin a wheel the image does not install.
          python tools/pyproject-deps.py --exclude essentia > runtime-requirements.txt

          # pip is upgraded inside the builder stage and stays in the venv the
          # parity gate inspects, so it is resolved here with everything else -
          # otherwise a pip release landing between the two builds would be the
          # one version left free to differ.
          echo pip >> runtime-requirements.txt
          cat runtime-requirements.txt

          # glibc 2.28 is the oldest manylinux tag torch publishes for. A wheel
          # built against an older glibc still installs on the trixie-based
          # python:3.13-slim, so targeting 2.28 can only resolve something more
          # conservative than the image would accept, never something it
          # cannot install.
          for platform in x86_64-manylinux_2_28 aarch64-manylinux_2_28; do
            uv pip compile \
              --quiet --no-header \
              --python-version 3.13 \
              --python-platform "$platform" \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              --index-strategy unsafe-best-match \
              runtime-requirements.txt \
              -o "constraints-${platform}.txt"
          done

          if ! diff -u \
            constraints-x86_64-manylinux_2_28.txt \
            constraints-aarch64-manylinux_2_28.txt; then
            echo "ERROR: linux/amd64 and linux/arm64 do not resolve to one set of versions."
            echo "A dependency is missing a wheel for one of them - the images could only"
            echo "be published with different versions, so this release stops here."
            exit 1
          fi

          mv constraints-x86_64-manylinux_2_28.txt constraints.txt
          rm -f constraints-aarch64-manylinux_2_28.txt runtime-requirements.txt
          resolved_count="$(grep -cE '^[^#[:space:]]' constraints.txt || true)"
          if (( resolved_count == 0 )); then
            echo "ERROR: the resolution produced no versions at all"
            exit 1
          fi
          echo "Both platforms resolve to the same ${resolved_count} versions:"
          cat constraints.txt

      - name: Upload resolved constraints
        uses: actions/upload-artifact@v7
        with:
          name: constraints
          path: constraints.txt
          retention-days: 14
          if-no-files-found: error

      # A release must not travel backwards. Re-running this workflow on an
      # older tag - v1.3 while 1.5 is published - passes every check above,
      # because pyproject.toml at that commit really does read 1.3. It would
      # then move 'latest' onto the older image and let the cleanup job delete
      # the newer 1.5 tag. Both are irreversible on Docker Hub.
      #
      # So the already-published tags decide: only the highest version this
      # repository has ever published moves 'latest' or prunes anything. An
      # older re-run still rebuilds and republishes its own version tag, which
      # is what a re-run is for - it just cannot rewrite the newer release's
      # history.
      - name: Determine whether this is the newest release
        id: newest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPOSITORY: fetchly
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          hub_token="$(
            jq -nc \
              --arg username "$DOCKERHUB_USERNAME" \
              --arg password "$DOCKERHUB_TOKEN" \
              '{username: $username, password: $password}' \
            | curl -fsSL \
                -H 'Content-Type: application/json' \
                -d @- \
                'https://hub.docker.com/v2/users/login/' \
            | jq -r '.token // .access_token // empty'
          )"

          if [[ -z "$hub_token" ]]; then
            echo "ERROR: Failed to obtain Docker Hub API token"
            exit 1
          fi

          api_base="https://hub.docker.com/v2/namespaces/${DOCKERHUB_USERNAME}/repositories/${REPOSITORY}/tags"
          next_url="${api_base}?page_size=100"
          : > published-tags.txt

          # A repository that does not exist yet answers 404. That is the very
          # first release, not an error - it simply has no published tag that
          # could outrank this one.
          while [[ -n "$next_url" && "$next_url" != "null" ]]; do
            response="$(curl -fsSL -H "Authorization: Bearer ${hub_token}" "$next_url" || true)"
            [[ -n "$response" ]] || break
            printf '%s' "$response" | jq -r '.results[].name' >> published-tags.txt
            next_url="$(printf '%s' "$response" | jq -r '.next // empty')"
          done

          # Only the is_newest line goes to GITHUB_OUTPUT, which accepts
          # key=value and nothing else; the reasoning goes to the log.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import sys

          # Architecture fragments (1.5-amd64) parse as prereleases of 1.5 and
          # would otherwise be compared as versions. They are build artefacts of
          # this workflow, not releases.
          ARCH_SUFFIXES = {
              "amd64", "arm64", "arm", "armv6", "armv7", "386",
              "ppc64le", "s390x", "riscv64", "mips64le", "loong64",
          }
          VERSION_RE = re.compile(r"^(\d+(?:\.\d+)*)(?:-([0-9A-Za-z.-]+))?$")

          def key(tag):
              match = VERSION_RE.match(tag)
              if not match:
                  return None
              suffix = match.group(2)
              if suffix in ARCH_SUFFIXES:
                  return None
              release = tuple(int(part) for part in match.group(1).split("."))
              # A prerelease sorts below its own release: 1.6-rc.1 < 1.6. GNU
              # `sort -V` gets this backwards, which is why the comparison is
              # done here rather than in the shell.
              return (release, (0, suffix) if suffix else (1, ""))

          current = os.environ["VERSION"]
          current_key = key(current)
          assert current_key is not None, f"unparseable version: {current}"

          with open("published-tags.txt", encoding="utf-8") as handle:
              published = {line.strip() for line in handle if line.strip()}

          newer = sorted(
              tag for tag in published
              if (tag_key := key(tag)) is not None and tag_key > current_key
          )

          if newer:
              print(f"Newer versions already published: {', '.join(newer)}", file=sys.stderr)
              print(f"{current} will be republished, but 'latest' stays put "
                    "and nothing is pruned.", file=sys.stderr)
              print("is_newest=false")
          else:
              print(f"{current} is the newest published version.", file=sys.stderr)
              print("is_newest=true")
          PY

  build:
    name: Build ${{ matrix.arch }} image
    needs: meta
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE_NAME: ${{ format('{0}/fetchly', secrets.DOCKERHUB_USERNAME) }}
    strategy:
      fail-fast: false
      matrix:
        # The only place architectures are declared. The manifest and release
        # jobs discover them from the digests these jobs publish, so adding an
        # entry here is all it takes. Both run on native runners - no QEMU -
        # which matters because both compile essentia from source: the
        # architectures must not differ in how that library was produced, or
        # one published image analyses audio differently from the other.
        #
        # Hence the identical timeouts. Each job builds essentia's static
        # 3rd-party chain (ffmpeg, fftw3, taglib, chromaprint, ...) and then
        # the library itself, which only a cold build cache pays for - a
        # release that does not move ESSENTIA_REF restores the stage instead.
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            cache_scope: amd64
            test_image: fetchly:test-amd64
            container_name: fetchly-test-amd64
            image_suffix: amd64
            timeout: 180
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            cache_scope: arm64
            test_image: fetchly:test-arm64
            container_name: fetchly-test-arm64
            image_suffix: arm64
            timeout: 180
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # torch alone is a multi-hundred-MB wheel and the finished image runs to
      # several GB; together with the GHA cache export that is close enough to
      # a stock runner's free space to be worth reclaiming first. None of these
      # toolchains take part in this build.
      - name: Free disk space
        run: |
          set -uo pipefail
          echo "Before:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          echo "After:"
          df -h /

      # docker/Dockerfile copies "pyproject.toml BUILD_INFO*" into the image and
      # app/utils/version.py reads BUILD_INFO for the commit shown on the
      # Settings page, falling back to "dev" when the file is absent. The file
      # is gitignored (setup.conf writes it by hand for local builds), so the
      # release build has to produce it here - otherwise every published image
      # would report itself as "dev".
      - name: Write BUILD_INFO
        run: |
          set -euo pipefail
          printf '%s\n' "${{ github.sha }}" > BUILD_INFO
          cat BUILD_INFO

      # The dependency versions the meta job resolved once, dropped into the
      # build context docker/Dockerfile reads them from. Both architectures get
      # this same file, which is what makes their venvs identical even though
      # pyproject.toml pins nothing.
      - name: Download resolved constraints
        uses: actions/download-artifact@v7
        with:
          name: constraints

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Version information travels as OCI labels rather than build args: the
      # Dockerfile deliberately declares no APP_VERSION/VCS_REF/BUILD_DATE args
      # (the app reads pyproject.toml and BUILD_INFO from disk), and passing undeclared
      # build args would only produce warnings.
      #
      # The toolchain the Dockerfile keeps rolling - the python base, essentia,
      # the ffmpeg release, yt-dlp, yt-dlp-ejs, deno - comes in as build args
      # resolved once by the meta job, and the Python dependencies as the
      # constraints.txt downloaded into the context above. Those are still
      # "whatever is newest", just newest as of one moment rather than as of
      # whenever each runner happened to reach the layer, which is what keeps
      # the amd64 and arm64 images carrying identical versions. The verify step
      # below proves it.
      - name: Build image for smoke tests
        run: |
          set -euo pipefail
          docker buildx build \
            --pull \
            --platform "${{ matrix.platform }}" \
            --target runtime \
            --load \
            --build-arg "PYTHON_BASE=${{ needs.meta.outputs.python_base }}" \
            --build-arg "ESSENTIA_REF=${{ needs.meta.outputs.essentia_ref }}" \
            --build-arg "FFMPEG_RELEASE_URL=${{ needs.meta.outputs.ffmpeg_release_url }}" \
            --build-arg "FFMPEG_SERIES=${{ needs.meta.outputs.ffmpeg_series }}" \
            --build-arg "YTDLP_VERSION=${{ needs.meta.outputs.ytdlp_version }}" \
            --build-arg "YTDLP_EJS_VERSION=${{ needs.meta.outputs.ytdlp_ejs_version }}" \
            --build-arg "DENO_VERSION=${{ needs.meta.outputs.deno_version }}" \
            --cache-from type=gha,scope=${{ matrix.cache_scope }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.cache_scope }} \
            --label "org.opencontainers.image.title=fetchly" \
            --label "org.opencontainers.image.description=Multi-platform video downloader with live dashboard, waveform trimming and BPM analysis" \
            --label "org.opencontainers.image.version=${{ needs.meta.outputs.version }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=${{ needs.meta.outputs.build_date }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "${{ matrix.test_image }}" \
            -f docker/Dockerfile \
            .

      # The container starts as root, bootstraps /app/data and drops to appuser
      # via gosu before exec'ing Gunicorn (docker/entrypoint.sh). Both env vars
      # are hard requirements - app/main.py raises at import time without them.
      - name: Start container and wait for /health
        run: |
          set -euo pipefail

          docker run -d --name "${{ matrix.container_name }}" \
            --platform "${{ matrix.platform }}" \
            -e FETCHLY_SECRET_KEY="ci-smoke-test-key-not-for-production" \
            -e LOG_LEVEL="info" \
            "${{ matrix.test_image }}"

          # /health is the unauthenticated endpoint the image's own HEALTHCHECK
          # uses (app/routes/api.py). curl is deliberately absent from the
          # runtime image, so probe with the Python already on PATH. The window
          # is wide because Gunicorn's first worker imports torch and essentia.
          echo "Waiting for in-container health endpoint..."
          for i in $(seq 1 120); do
            if ! docker ps -q -f name="${{ matrix.container_name }}" | grep -q .; then
              echo "✗ Container exited during startup after ${i}s"
              echo "=== Container logs ==="
              docker logs "${{ matrix.container_name }}" 2>&1 || echo "Could not retrieve logs"
              exit 1
            fi

            if docker exec "${{ matrix.container_name }}" python -c \
                "import os, urllib.request as u; u.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/health', timeout=2)" \
                > /dev/null 2>&1; then
              echo "✓ Health endpoint answered after ${i}s"
              exit 0
            fi

            sleep 1
          done

          echo "✗ Health check timeout after 120s"
          echo "=== Container logs ==="
          docker logs "${{ matrix.container_name }}" 2>&1 || echo "Could not retrieve logs"
          echo "=== Container status ==="
          docker ps -a -f name="${{ matrix.container_name }}"
          exit 1

      # A healthy /health only proves FastAPI came up. These two checks cover
      # what this image actually exists to provide and what a build can get
      # silently wrong: the privilege drop, and an external toolchain that
      # resolves from the running container's PATH rather than merely from the
      # build stage that installed it.
      - name: Verify privilege drop
        run: |
          set -euo pipefail
          owner_uid="$(docker exec "${{ matrix.container_name }}" stat -c '%u' /proc/1)"
          if [[ "$owner_uid" != "1000" ]]; then
            echo "✗ PID 1 runs as uid ${owner_uid}, expected 1000 (appuser)"
            docker logs "${{ matrix.container_name }}" 2>&1 | tail -50 || true
            exit 1
          fi
          echo "✓ Gunicorn runs as appuser (uid 1000)"

      - name: Verify toolchain and build metadata
        run: |
          set -euo pipefail
          docker exec -i \
            -e EXPECTED_VERSION="${VERSION}" \
            -e EXPECTED_BUILD_INFO="${{ github.sha }}" \
            "${{ matrix.container_name }}" python - <<'PY'
          import os
          import sys

          from app.utils.version import (
              get_build_info,
              get_ffmpeg_version,
              get_js_runtime_version,
              get_version,
              get_wavesurfer_version,
              get_ytdlp_ejs_version,
              get_ytdlp_version,
          )

          failures = []

          # These are the same probes the Settings page renders. Each returns
          # "unavailable" instead of raising, so a broken toolchain would
          # otherwise only show up as a blank tile in production.
          probes = {
              "ffmpeg": get_ffmpeg_version(),
              "yt-dlp": get_ytdlp_version(),
              "yt-dlp-ejs": get_ytdlp_ejs_version(),
              "deno": get_js_runtime_version(),
              "wavesurfer": get_wavesurfer_version(),
          }
          for name, value in probes.items():
              print(f"{name}: {value}")
              if value == "unavailable":
                  failures.append(f"{name} does not resolve inside the running image")

          version = get_version()
          build_info = get_build_info()
          print(f"VERSION (from pyproject.toml): {version}")
          print(f"BUILD_INFO: {build_info}")

          expected_version = os.environ["EXPECTED_VERSION"]
          expected_build_info = os.environ["EXPECTED_BUILD_INFO"]

          if version != expected_version:
              failures.append(f"VERSION is {version!r}, expected {expected_version!r}")
          if build_info != expected_build_info:
              failures.append(f"BUILD_INFO is {build_info!r}, expected {expected_build_info!r}")

          if failures:
              for failure in failures:
                  print(f"✗ {failure}", file=sys.stderr)
              sys.exit(1)

          print("✓ Toolchain and build metadata OK")
          PY

      # The only step that proves essentia computes rather than merely imports.
      # Both architectures compile essentia from the same pinned commit, so the
      # library is the same everywhere except for FFTW's SIMD backend - sse2 on
      # amd64, NEON on arm64 - and that backend is precisely the part no
      # version pin can assert. The runtime stage's `import essentia.standard`
      # only shows that _essentia.so loads and resolves its symbols; an image
      # whose RhythmExtractor2013 returned nonsense would pass every other
      # check here and surface on a user's first analysis job instead. Running
      # it on both arches is what makes the two builds comparable.
      - name: Verify BPM analysis (${{ matrix.arch }})
        run: |
          set -euo pipefail
          docker exec -i "${{ matrix.container_name }}" python - <<'PY'
          import math
          import sys
          import wave

          import numpy as np

          SAMPLE_RATE = 44100
          EXPECTED_BPM = 120.0
          TOLERANCE_BPM = 2.0
          DURATION_S = 20.0
          CLICK_PATH = "/tmp/bpm-smoke.wav"

          # A click track is deliberately the simplest signal
          # RhythmExtractor2013 can be asked about: one 1 kHz burst per beat,
          # decaying over ~25 ms, at exactly EXPECTED_BPM. Anything reading
          # that as a different tempo is broken, not merely imprecise. Built
          # with numpy + wave rather than an ffmpeg filter so the fixture
          # cannot itself become the flaky part.
          period = 60.0 / EXPECTED_BPM
          t = np.arange(int(SAMPLE_RATE * DURATION_S)) / SAMPLE_RATE
          envelope = np.exp(-40.0 * np.mod(t, period))
          samples = np.sin(2.0 * math.pi * 1000.0 * t) * envelope * 0.8

          with wave.open(CLICK_PATH, "wb") as handle:
              handle.setnchannels(1)
              handle.setsampwidth(2)
              handle.setframerate(SAMPLE_RATE)
              handle.writeframes((samples * 32767).astype("<i2").tobytes())

          # Mirrors app/bpm.py: MonoLoader on defaults, then
          # RhythmExtractor2013(method="multifeature"). MonoLoader decodes
          # through the static ffmpeg essentia links against, so the compiled
          # audio I/O path is covered too, not just the rhythm algorithm.
          from essentia.standard import MonoLoader, RhythmExtractor2013

          audio = MonoLoader(filename=CLICK_PATH)()
          bpm, beats, confidence, _, _ = RhythmExtractor2013(method="multifeature")(audio)

          bpm = float(bpm)
          confidence = float(confidence)
          print(f"samples loaded : {len(audio)}")
          print(f"detected BPM   : {bpm:.3f}  (expected {EXPECTED_BPM} +/- {TOLERANCE_BPM})")
          print(f"beats detected : {len(beats)}")
          print(f"confidence     : {confidence:.3f}")

          failures = []
          if len(audio) == 0:
              failures.append("MonoLoader returned no samples")
          if not math.isfinite(bpm):
              failures.append(f"BPM is not a finite number: {bpm!r}")
          elif abs(bpm - EXPECTED_BPM) > TOLERANCE_BPM:
              failures.append(
                  f"BPM {bpm:.3f} is off by more than {TOLERANCE_BPM} from {EXPECTED_BPM}"
              )
          if len(beats) < int(DURATION_S / period) - 4:
              failures.append(
                  f"only {len(beats)} beats found in {DURATION_S:.0f}s at {EXPECTED_BPM} BPM"
              )

          if failures:
              for failure in failures:
                  print(f"✗ {failure}", file=sys.stderr)
              sys.exit(1)

          print("✓ essentia BPM analysis OK")
          PY

      # What actually proves the two images agree. Each architecture writes the
      # resolved version of everything that rolls into an artifact; the
      # manifest job compares those files and refuses to publish an index whose
      # halves differ. Resolving once in the meta job makes drift unlikely, but
      # only this makes it impossible to publish silently - a cache hit on a
      # stale layer or a build arg that failed to reach the Dockerfile would
      # both land here.
      - name: Record toolchain versions (${{ matrix.arch }})
        run: |
          set -euo pipefail
          mkdir -p toolchain
          docker exec -i "${{ matrix.container_name }}" python - \
            > "toolchain/${{ matrix.image_suffix }}.txt" <<'PY'
          import platform
          from importlib import metadata

          from app.utils.version import (
              get_ffmpeg_version,
              get_js_runtime_version,
              get_version,
              get_wavesurfer_version,
              get_ytdlp_ejs_version,
              get_ytdlp_version,
          )

          # Only architecture-independent identities belong here. A value that
          # legitimately differs per architecture - a wheel's platform tag, the
          # machine name - would turn this gate into a permanent failure, so it
          # records versions and nothing else.
          #
          # Every distribution in the venv, not a curated list: nothing in
          # pyproject.toml is pinned, so a transitive dependency is as free to
          # differ between the two builds as a direct one. The release workflow
          # resolves them once and constrains both builds to that resolution;
          # this is where that is proven rather than assumed.
          versions = {
              "python": platform.python_version(),
              "fetchly": get_version(),
              "ffmpeg": get_ffmpeg_version(),
              "yt-dlp": get_ytdlp_version(),
              "yt-dlp-ejs": get_ytdlp_ejs_version(),
              "deno": get_js_runtime_version(),
              "wavesurfer": get_wavesurfer_version(),
          }
          for dist in metadata.distributions():
              name = dist.metadata["Name"]
              if name:
                  versions[f"pypi:{name.lower().replace('_', '-')}"] = dist.version

          for name, value in sorted(versions.items()):
              print(f"{name}={value}")
          PY

          echo "=== ${{ matrix.arch }} toolchain ==="
          cat "toolchain/${{ matrix.image_suffix }}.txt"

      - name: Upload toolchain versions (${{ matrix.arch }})
        uses: actions/upload-artifact@v7
        with:
          name: toolchain-${{ matrix.image_suffix }}
          path: toolchain/${{ matrix.image_suffix }}.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove smoke-test container
        if: always()
        run: docker rm -f "${{ matrix.container_name }}" 2>/dev/null || true

      - name: Tag image for push
        run: |
          set -euo pipefail
          docker tag "${{ matrix.test_image }}" "${IMAGE_NAME}:${VERSION}-${{ matrix.image_suffix }}"

      - name: Trivy vulnerability scan
        # Pinned to an immutable commit SHA, not a mutable ref. In March 2026
        # (GHSA-69fq-xp46-6x23) an attacker force-pushed 76 of 77 trivy-action
        # tags to a credential-stealing commit; this step runs after the Docker
        # Hub login, so a compromised action would see those credentials.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: 'false'
          image-ref: '${{ matrix.test_image }}'
          format: 'json'
          output: 'trivy-${{ matrix.image_suffix }}.json'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          # Vulnerabilities only. trivy-action also runs the secret scanner by
          # default, and pointing that at a venv full of third-party code is a
          # false-positive generator: yt-dlp hardcodes the public API
          # credentials of the sites it supports, so the scan trips on e.g.
          # yt_dlp/extractor/shahid.py, where Shahid's own AWS API Gateway key
          # has sat in upstream's public source for years and ships in every
          # yt-dlp release. Those are neither fetchly's secrets nor secret at
          # all, and there is no useful gate to build on them here - this step
          # exists to fail the release on a fixable CVE. It is also what
          # Trivy's own log recommends for scan time.
          scanners: 'vuln'
          # Longer than the 10m upstream default: the venv this image ships
          # (torch, essentia, beat-this and their transitive deps) is a
          # large library surface to walk.
          timeout: '15m'
          # Accepted findings live in .trivyignore at the repository root, one
          # CVE id per line with the reason in a comment above it.
          trivyignores: '.trivyignore'

      - name: Generate Trivy summary (${{ matrix.arch }})
        if: always()
        run: |
          set -euo pipefail
          ARCH="${{ matrix.image_suffix }}"
          FILE="trivy-${ARCH}.json"

          if [[ ! -f "$FILE" ]]; then
            echo "### Trivy (${ARCH}): Scan failed — no results file" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$FILE" 2>/dev/null || echo 0)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "$FILE" 2>/dev/null || echo 0)

          if (( CRITICAL == 0 && HIGH == 0 )); then
            SUMMARY="✅ No HIGH/CRITICAL vulnerabilities found"
          else
            SUMMARY="⚠️ ${CRITICAL} CRITICAL, ${HIGH} HIGH vulnerabilities"
          fi

          echo "### Trivy Scan Results (${ARCH})" >> "$GITHUB_STEP_SUMMARY"
          if (( CRITICAL > 0 || HIGH > 0 )); then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH") | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName)\t\(.InstalledVersion)"' \
              "$FILE" 2>/dev/null | head -20 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Trivy findings (${{ matrix.arch }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-findings-${{ matrix.image_suffix }}
          path: trivy-${{ matrix.image_suffix }}.json
          retention-days: 14
          if-no-files-found: warn

      - name: Push arch-specific image
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:${VERSION}-${{ matrix.image_suffix }}"

      # The manifest is assembled from these digests rather than from the arch
      # tags. A digest names one immutable image; a tag can be overwritten
      # between this push and the manifest job. It also removes the second
      # architecture list that job used to carry - an architecture that never
      # built now contributes no digest, instead of contributing a tag
      # reference that does not resolve.
      #
      # This runs immediately after the push, so a digest artifact exists for
      # exactly those architectures whose tag reached Docker Hub. The fragment
      # cleanup job relies on that correspondence.
      - name: Record image digest
        run: |
          set -euo pipefail
          mkdir -p digests

          digest="$(docker buildx imagetools inspect \
            "${IMAGE_NAME}:${VERSION}-${{ matrix.image_suffix }}" \
            --format '{{.Manifest.Digest}}')"

          case "$digest" in
            sha256:*) ;;
            *)
              echo "ERROR: unexpected digest for ${{ matrix.image_suffix }}: '${digest}'"
              exit 1
              ;;
          esac

          printf '%s' "$digest" > "digests/${{ matrix.image_suffix }}"
          echo "${{ matrix.image_suffix }} -> ${digest}"

      - name: Upload image digest (${{ matrix.arch }})
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.image_suffix }}
          path: digests/${{ matrix.image_suffix }}
          retention-days: 1
          if-no-files-found: error

  create-manifest:
    name: Create multi-arch manifest
    needs: [meta, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE_NAME: ${{ format('{0}/fetchly', secrets.DOCKERHUB_USERNAME) }}
      IS_NEWEST: ${{ needs.meta.outputs.is_newest }}
    permissions:
      contents: read

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@v7
        with:
          pattern: image-digest-*
          path: digests/
          merge-multiple: true

      - name: Download toolchain versions
        uses: actions/download-artifact@v7
        with:
          pattern: toolchain-*
          path: toolchain/
          merge-multiple: true

      # The release gate for "both images contain the same versions". Runs
      # before the manifest is created, so a mismatch stops the publish rather
      # than being discovered in an already-tagged image.
      - name: Verify architectures carry identical versions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import sys

          files = sorted(pathlib.Path("toolchain").glob("*.txt"))
          if not files:
              sys.exit("FAIL: no toolchain manifests were published by the build jobs")

          def read(path):
              out = {}
              for line in path.read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  name, _, value = line.partition("=")
                  out[name] = value
              return out

          recorded = {path.stem: read(path) for path in files}
          for arch, versions in recorded.items():
              print(f"--- {arch} ---")
              for name, value in sorted(versions.items()):
                  print(f"  {name}={value}")

          if len(recorded) == 1:
              print("\nOnly one architecture was built; nothing to compare.")
              sys.exit(0)

          names = sorted({name for versions in recorded.values() for name in versions})
          mismatches = []
          for name in names:
              seen = {arch: versions.get(name, "<missing>") for arch, versions in recorded.items()}
              if len(set(seen.values())) > 1:
                  detail = ", ".join(f"{arch}={value}" for arch, value in sorted(seen.items()))
                  mismatches.append(f"{name}: {detail}")

          if mismatches:
              print("\nFAIL: the architectures do not carry the same versions:", file=sys.stderr)
              for mismatch in mismatches:
                  print(f"  {mismatch}", file=sys.stderr)
              print(
                  "\nEvery rolling component is resolved once in the meta job and passed "
                  "to both builds, so this means a build arg did not reach the Dockerfile, "
                  "or a stale cached layer was reused.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"\nOK: {', '.join(sorted(recorded))} carry identical versions of all {len(names)} components")
          PY

      - name: Create and push manifest
        run: |
          set -euo pipefail

          # One file per architecture, named after it, containing its digest.
          shopt -s nullglob
          digest_files=(digests/*)
          if (( ${#digest_files[@]} == 0 )); then
            echo "ERROR: no image digests were published by the build jobs"
            exit 1
          fi

          declare -a sources=()
          declare -a platforms=()
          echo "Assembling index from:"
          for file in "${digest_files[@]}"; do
            arch="$(basename "$file")"
            digest="$(tr -d '[:space:]' < "$file")"
            sources+=("${IMAGE_NAME}@${digest}")
            platforms+=("linux/${arch}")
            echo "  linux/${arch}  ${digest}"
          done

          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${VERSION}" \
            "${sources[@]}"
          echo "Pushed manifest: ${IMAGE_NAME}:${VERSION}"

          # 'latest' moves only for a stable release, and only when this really
          # is the newest one - see the meta job's is_newest probe.
          if [[ "$VERSION" == *-* ]]; then
            echo "Skipping 'latest': ${VERSION} is a prerelease"
          elif [[ "$IS_NEWEST" != "true" ]]; then
            echo "Skipping 'latest': a newer version is already published, and 'latest' must never move backwards"
          else
            docker buildx imagetools create \
              --tag "${IMAGE_NAME}:latest" \
              "${sources[@]}"
            echo "Pushed manifest: ${IMAGE_NAME}:latest"
            touch latest-pushed
          fi

          printf '%s\n' "${platforms[@]}" > expected-platforms.txt

      # imagetools create reports success as soon as the registry accepts the
      # index - it does not confirm the index describes what was intended. A
      # missing or duplicated architecture would otherwise surface as `docker
      # pull` quietly selecting the wrong image on a user's machine.
      - name: Verify manifest
        run: |
          set -euo pipefail

          cat > verify_manifest.py <<'PY'
          import json
          import sys

          manifest_file, expected_file = sys.argv[1], sys.argv[2]

          with open(manifest_file, encoding="utf-8") as handle:
              index = json.load(handle)
          with open(expected_file, encoding="utf-8") as handle:
              expected = sorted(line.strip() for line in handle if line.strip())

          manifests = index.get("manifests")
          if manifests is None:
              sys.exit(f"FAIL: {manifest_file} is not a manifest index")

          # Identity includes the variant, so linux/arm/v6 and linux/arm/v7 are
          # two entries rather than a duplicate; the expected set is compared at
          # os/architecture level, because that is how the build matrix names
          # them.
          identities = []
          found = set()
          for entry in manifests:
              platform = entry.get("platform") or {}
              architecture = platform.get("architecture")
              # Attestations ride along as unknown/unknown entries.
              if not architecture or architecture == "unknown":
                  continue
              operating_system = platform.get("os")
              identities.append(
                  (operating_system, architecture, platform.get("variant") or "")
              )
              found.add(f"{operating_system}/{architecture}")

          duplicates = sorted({
              "/".join(part for part in identity if part)
              for identity in identities
              if identities.count(identity) > 1
          })
          if duplicates:
              sys.exit(f"FAIL: index lists duplicate platforms: {', '.join(duplicates)}")

          if sorted(found) != expected:
              sys.exit(
                  f"FAIL: index describes {sorted(found)}, expected {expected}"
              )

          print(f"OK: {manifest_file} describes {', '.join(sorted(found))}")
          PY

          docker buildx imagetools inspect --raw "${IMAGE_NAME}:${VERSION}" > manifest-version.json
          python3 verify_manifest.py manifest-version.json expected-platforms.txt

          if [[ -f latest-pushed ]]; then
            docker buildx imagetools inspect --raw "${IMAGE_NAME}:latest" > manifest-latest.json
            python3 verify_manifest.py manifest-latest.json expected-platforms.txt
          fi

  # Deliberately always(): the arch tags are pushed by the build jobs, but only
  # the manifest above makes them redundant. If a later architecture fails, or
  # the manifest step does, the earlier architectures' tags are already on
  # Docker Hub with nothing left to remove them, and the repository advertises
  # a half-published release until the next successful run happens to prune it.
  # This job removes them on every outcome, cancellation included.
  #
  # It deletes exactly the tags the build jobs reported pushing - one digest
  # artifact per pushed tag - so it never has to guess at architecture names,
  # and a build that failed before its push leaves nothing to clean up.
  cleanup-arch-tags:
    name: Remove architecture fragment tags
    needs: [meta, build, create-manifest]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Download image digests
        id: digests
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: image-digest-*
          path: digests/
          merge-multiple: true

      - name: Delete architecture tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPOSITORY: fetchly
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail

          # meta itself may have failed, in which case there is no version and
          # certainly no pushed tag.
          if [[ -z "${VERSION}" ]]; then
            echo "No version resolved - nothing was pushed, nothing to clean up."
            exit 0
          fi

          shopt -s nullglob
          digest_files=(digests/*)
          if (( ${#digest_files[@]} == 0 )); then
            echo "No image digests were published - no architecture tags exist."
            exit 0
          fi

          hub_token="$(
            jq -nc \
              --arg username "$DOCKERHUB_USERNAME" \
              --arg password "$DOCKERHUB_TOKEN" \
              '{username: $username, password: $password}' \
            | curl -fsSL \
                -H 'Content-Type: application/json' \
                -d @- \
                'https://hub.docker.com/v2/users/login/' \
            | jq -r '.token // .access_token // empty'
          )"

          if [[ -z "$hub_token" ]]; then
            echo "ERROR: Failed to obtain Docker Hub API token"
            exit 1
          fi

          api_base="https://hub.docker.com/v2/namespaces/${DOCKERHUB_USERNAME}/repositories/${REPOSITORY}/tags"

          for file in "${digest_files[@]}"; do
            tag="${VERSION}-$(basename "$file")"
            status_code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer ${hub_token}" \
              "${api_base}/${tag}")"

            case "$status_code" in
              202|204) echo "Deleted fragment tag: ${tag}" ;;
              404)     echo "Fragment tag already absent: ${tag}" ;;
              *)
                echo "ERROR: Failed to delete '${tag}' (HTTP ${status_code})"
                exit 1
                ;;
            esac
          done

  # This is the destructive one: it deletes every published tag except the
  # current version and 'latest'. It is therefore gated on is_newest as well -
  # an older re-run must not be able to delete the newer releases that came
  # after it. Ordered after the fragment cleanup so the two are not racing to
  # delete the same arch tags, which would make the final assertion below
  # non-deterministic.
  cleanup-dockerhub-tags:
    name: Keep only latest and current version tag
    needs: [meta, create-manifest, cleanup-arch-tags]
    if: >-
      needs.create-manifest.result == 'success' &&
      needs.cleanup-arch-tags.result == 'success' &&
      needs.meta.outputs.is_newest == 'true'
    runs-on: ubuntu-24.04
    # Deletion is verified with polling loops, so cap the total runtime.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Delete all non-current Docker Hub tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPOSITORY: fetchly
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            echo "ERROR: jq is required for Docker Hub tag cleanup"
            exit 1
          fi

          keep_version="${VERSION}"
          keep_latest="latest"
          api_base="https://hub.docker.com/v2/namespaces/${DOCKERHUB_USERNAME}/repositories/${REPOSITORY}/tags"

          list_tags() {
            local next_url="${api_base}?page_size=100"
            local response=""

            while [[ -n "$next_url" && "$next_url" != "null" ]]; do
              response="$(curl -fsSL \
                -H "Authorization: Bearer ${hub_token}" \
                "$next_url")"

              printf '%s' "$response" | jq -r '.results[].name'
              next_url="$(printf '%s' "$response" | jq -r '.next // empty')"
            done
          }

          wait_for_tag_absent() {
            local tag="$1"
            local tag_url="${api_base}/${tag}"
            local status_code=""

            for _ in $(seq 1 12); do
              status_code="$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${hub_token}" \
                "$tag_url")"

              case "$status_code" in
                404)
                  echo "Confirmed tag absent: $tag"
                  return 0
                  ;;
                200)
                  sleep 5
                  ;;
                *)
                  echo "ERROR: Failed to verify deletion for '$tag' (HTTP $status_code)"
                  return 1
                  ;;
              esac
            done

            echo "ERROR: Tag still visible after cleanup propagation: $tag"
            return 1
          }

          echo "Keeping Docker Hub tags:"
          echo "  ${DOCKERHUB_USERNAME}/${REPOSITORY}:${keep_version}"
          echo "  ${DOCKERHUB_USERNAME}/${REPOSITORY}:${keep_latest}"

          token_response="$(
            jq -nc \
              --arg username "$DOCKERHUB_USERNAME" \
              --arg password "$DOCKERHUB_TOKEN" \
              '{username: $username, password: $password}' \
            | curl -fsSL \
                -H 'Content-Type: application/json' \
                -d @- \
                'https://hub.docker.com/v2/users/login/'
          )"

          hub_token="$(printf '%s' "$token_response" | jq -r '.token // .access_token // empty')"
          if [[ -z "$hub_token" ]]; then
            echo "ERROR: Failed to obtain Docker Hub API token"
            printf '%s\n' "$token_response"
            exit 1
          fi

          declare -a tags_to_delete=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue

            if [[ "$tag" == "$keep_version" || "$tag" == "$keep_latest" ]]; then
              echo "Keeping tag: $tag"
              continue
            fi

            tags_to_delete+=("$tag")
          done < <(list_tags)

          for tag in "${tags_to_delete[@]}"; do
            echo "Deleting tag: $tag"
            status_code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer ${hub_token}" \
              "${api_base}/${tag}")"

            case "$status_code" in
              202|204)
                echo "Deleted tag: $tag"
                wait_for_tag_absent "$tag"
                ;;
              404)
                echo "Tag already absent: $tag"
                ;;
              *)
                echo "ERROR: Failed to delete tag '$tag' (HTTP $status_code)"
                exit 1
                ;;
            esac
          done

          declare -A remaining_tags=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            remaining_tags["$tag"]=1

            if [[ "$tag" != "$keep_version" && "$tag" != "$keep_latest" ]]; then
              echo "ERROR: Unexpected tag remained after cleanup: $tag"
              exit 1
            fi
          done < <(list_tags | sort -u)

          # Prereleases never publish 'latest' (see create-manifest), so only
          # require it for stable releases. Demanding it unconditionally made
          # the first prerelease fail here, after the images were already pushed.
          declare -a expected_tags=("$keep_version")
          if [[ "$VERSION" != *-* ]]; then
            expected_tags+=("$keep_latest")
          fi

          for tag in "${expected_tags[@]}"; do
            if [[ -z "${remaining_tags[$tag]:-}" ]]; then
              echo "ERROR: Expected tag missing after cleanup: $tag"
              exit 1
            fi
          done

  create-release:
    name: Create GitHub Release
    needs: [meta, create-manifest, cleanup-dockerhub-tags]
    # A published manifest is what a release documents. The pruning job is
    # skipped for an older re-run (see is_newest), and a skipped result must
    # not suppress the release notes for a version that really was republished
    # - only an outright cleanup failure should.
    if: >-
      needs.create-manifest.result == 'success' &&
      needs.cleanup-dockerhub-tags.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE_NAME: ${{ format('{0}/fetchly', secrets.DOCKERHUB_USERNAME) }}
      IS_NEWEST: ${{ needs.meta.outputs.is_newest }}
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download Trivy findings
        uses: actions/download-artifact@v7
        with:
          pattern: trivy-findings-*
          path: trivy-reports/
          merge-multiple: false

      # The architectures the release actually published, straight from the
      # manifest's own sources - not a list this file has to keep in step.
      - name: Download image digests
        uses: actions/download-artifact@v7
        with:
          pattern: image-digest-*
          path: digests/
          merge-multiple: true

      - name: Create or update GitHub Release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const version = process.env.VERSION;
            const imageName = process.env.IMAGE_NAME;
            const arches = fs.readdirSync('digests').sort();
            const isPrerelease = version.includes('-');
            const isNewest = process.env.IS_NEWEST === 'true';
            const tagName = 'v' + version;
            const platformNote = arches.length > 1
              ? 'multi-arch: ' + arches.map(a => 'linux/' + a).join(', ')
              : 'linux/' + arches[0];

            function parseTrivyStatus(arch) {
              const file = path.join('trivy-reports', `trivy-findings-${arch}`, `trivy-${arch}.json`);
              try {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                let critical = 0, high = 0;
                for (const result of (data.Results || [])) {
                  for (const vuln of (result.Vulnerabilities || [])) {
                    if (vuln.Severity === 'CRITICAL') critical++;
                    else if (vuln.Severity === 'HIGH') high++;
                  }
                }
                return (critical === 0 && high === 0)
                  ? '✅ No HIGH/CRITICAL vulnerabilities found'
                  : `⚠️ ${critical} CRITICAL, ${high} HIGH vulnerabilities`;
              } catch {
                return '❓ Report unavailable';
              }
            }

            function extractVersionSection(markdown, targetVersion) {
              const headingPattern = /^## \[([^\]]+)\] - .+$/gm;
              let startIndex = -1;
              let endIndex = markdown.length;
              let match;

              while ((match = headingPattern.exec(markdown)) !== null) {
                if (startIndex === -1 && match[1] === targetVersion) {
                  startIndex = match.index;
                  continue;
                }
                if (startIndex !== -1) {
                  endIndex = match.index;
                  break;
                }
              }

              if (startIndex === -1) {
                return null;
              }

              // Older entries are folded away in a <details> block whose
              // opening tags sit below the newest entry and whose </details>
              // closes at the end of the file. Cutting on headings alone would
              // therefore carry an unclosed <details>/<summary> into the
              // release body, along with every older entry it folds away. The
              // section ends at whichever comes first: the next heading, or
              // that marker.
              //
              // A <details> used deliberately inside one entry is cut along
              // with it; folding is expected around entries, not within one.
              const detailsIndex = markdown.indexOf('<details', startIndex);
              if (detailsIndex !== -1 && detailsIndex < endIndex) {
                endIndex = detailsIndex;
              }

              return markdown.slice(startIndex, endIndex).trim();
            }

            // CHANGELOG.md is optional - without it the release body falls
            // back to the placeholder below. The heading is matched against the
            // pyproject.toml version verbatim, not by semver, so a release of 1.5
            // needs a "## [1.5] - <date>" heading; "## [1.5.0]" does not match
            // and silently yields the placeholder.
            let changelogSection = null;
            try {
              const changelogText = fs.readFileSync('CHANGELOG.md', 'utf8');
              changelogSection = extractVersionSection(changelogText, version);
              if (!changelogSection) {
                console.log('No matching changelog section found for version ' + version);
              }
            } catch (err) {
              console.log('Could not read CHANGELOG.md: ' + err.message);
            }

            const tags = [
              '- `' + imageName + ':' + version + '` (' + platformNote + ')'
            ];
            if (isPrerelease) {
              tags.push('- `latest` unchanged: prereleases do not move it.');
            } else if (!isNewest) {
              tags.push('- `latest` unchanged: a newer version is already published.');
            } else {
              tags.push('- `' + imageName + ':latest` (' + platformNote + ')');
            }

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Reports are attached to the release below; run artifacts expire.
            const assetBase = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tagName}`;

            const scanRows = arches.map(arch =>
              '| ' + arch + ' | ' + parseTrivyStatus(arch) +
              ' | [trivy-' + arch + '.json](' + assetBase + '/trivy-' + arch + '.json) |'
            );

            const body = [
              '## fetchly ' + version,
              '',
              '**Docker Image:** `docker pull ' + imageName + ':' + version + '`',
              '',
              '### Available Tags',
              ...tags,
              '',
              '### Security Scan Results',
              '',
              '| Architecture | Status | Findings |',
              '|---|---|---|',
              ...scanRows,
              '| run | workflow details | [Actions Run](' + runUrl + ') |',
              '',
              '> Scanned with [Trivy](https://trivy.dev/) for HIGH and CRITICAL severity vulnerabilities (unfixed CVEs ignored).',
              '',
              '### Changelog',
              changelogSection || '_No matching CHANGELOG entry found for this version._'
            ].join('\n');

            const releaseFields = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: 'fetchly ' + version,
              body: body,
              draft: false,
              prerelease: isPrerelease
            };

            // Look the release up first. Treating every 422 as "already exists"
            // also swallowed unrelated validation errors and then failed in a
            // confusing way inside the recovery path.
            let release = null;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName
              }));
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            if (release) {
              ({ data: release } = await github.rest.repos.updateRelease({
                ...releaseFields,
                release_id: release.id
              }));
              console.log('Updated release ' + tagName);
            } else {
              ({ data: release } = await github.rest.repos.createRelease(releaseFields));
              console.log('Created release ' + tagName);
            }

            // Attach the scan reports to the release. The body links to them,
            // but run artifacts expire after retention-days, which left older
            // releases pointing at downloads that no longer exist.
            for (const arch of arches) {
              const assetName = `trivy-${arch}.json`;
              const file = path.join('trivy-reports', `trivy-findings-${arch}`, assetName);
              try {
                const data = fs.readFileSync(file);
                const existing = (release.assets || []).find(a => a.name === assetName);
                if (existing) {
                  await github.rest.repos.deleteReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: existing.id
                  });
                }
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  name: assetName,
                  data: data,
                  headers: {
                    'content-type': 'application/json',
                    'content-length': data.length
                  }
                });
                console.log('Attached ' + assetName);
              } catch (err) {
                console.log('Could not attach ' + assetName + ': ' + err.message);
              }
            }
