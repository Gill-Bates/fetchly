name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'LICENSE'
      # The docs toolchain is installed from pyproject.toml's docs extra with
      # tools/pyproject-deps.py, so both decide what this workflow builds and
      # scans - a bump to either has to re-run it.
      - 'pyproject.toml'
      - 'tools/pyproject-deps.py'
      - '.github/workflows/docs-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'pyproject.toml'
      - 'tools/pyproject-deps.py'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:
  # Docs follow main, not the release that triggered this run. A release
  # (docker-build.yml) only adds a rebuild trigger; the checkout below is always
  # the current main, so re-running an old tag or publishing a prerelease can
  # never roll the public site back to that commit's documentation.
  workflow_run:
    workflows:
      - 'Docker Multi-Arch Build'
    types:
      - completed
  schedule:
    # Weekly re-scan: new CVEs in the docs dependencies would otherwise only
    # surface when something in the repo happens to change.
    - cron: '17 4 * * 1'

permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolves the docs environment exactly once. The frozen result is what both
  # the build and the CVE scan install or read, so the scanner always sees the
  # environment the site was built in, transitive dependencies included.
  resolve:
    # workflow_run fires on every conclusion of "Docker Multi-Arch Build"
    # (success, failure, cancelled...). Only a successful release should
    # trigger a docs rebuild; every other trigger has no such conclusion.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      # pyproject.toml is the single dependency manifest; the docs toolchain
      # lives in its [project.optional-dependencies] docs extra. Installing
      # `.[docs]` would drag in the runtime dependencies (torch included), so
      # only the extra is materialised. The direct dependencies are pinned there
      # on purpose (see the comment above that table); transitive ones resolve
      # to their newest release here, once.
      #
      # The frozen file name has to contain "requirement" or Trivy's pip
      # analyzer does not pick it up.
      - name: Resolve and freeze the docs environment
        run: |
          set -euo pipefail
          python3 tools/pyproject-deps.py docs > requirements-docs.txt
          python3 -m venv .docs-env
          .docs-env/bin/python -m pip install --quiet --upgrade pip
          .docs-env/bin/python -m pip install --quiet -r requirements-docs.txt
          .docs-env/bin/python -m pip freeze --all > docs-requirements-frozen.txt
          cat docs-requirements-frozen.txt

      - name: Upload frozen docs environment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-requirements
          path: docs-requirements-frozen.txt
          retention-days: 1
          if-no-files-found: error

  build:
    # The weekly schedule exists for the CVE scan only; building the site and
    # checking links would add nothing and let a flaky link block that scan.
    needs: resolve
    if: github.event_name != 'schedule'
    # Named, as in ci.yml and docker-build.yml, and on 26.04 ahead of the
    # ubuntu-latest migration (actions/runner-images#14748). The docs toolchain
    # is installed from pyproject.toml onto a setup-python interpreter, so the
    # host only has to provide git for the revision-date plugin.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history for git-based plugins

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Same interpreter as ci.yml, the release workflow and
          # ARG PYTHON_BASE=python:3.13-slim. The docs toolchain does not need
          # it, but two Python versions in one repo's CI is one more thing that
          # can differ between a green check and a broken build.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download frozen docs environment
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: docs-requirements

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install --upgrade pip
          pip install -r docs-requirements-frozen.txt

      - name: Copy root files to docs
        run: |
          cp CHANGELOG.md docs/changelog.md
          cp LICENSE docs/license.md

      - name: Build documentation
        run: |
          mkdocs build -f docs/mkdocs.yml --strict

      # Runs against the build that gets deployed. It used to live in a
      # separate job that rebuilt the docs from a shallow checkout, so the
      # git-revision-date plugin saw different history than the real build.
      # img.shields.io is excluded because the badges are generated on demand
      # by a third party that throttles: the release badge on the landing page
      # answered 503 after lychee's retries while the license and Docker Hub
      # badges from the same host passed in the same run. A badge service
      # having a bad minute says nothing about the documentation, and blocking
      # the Pages deploy on it only produces reruns.
      - name: Check links
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621 # v1.10.0
        with:
          args: >-
            --verbose
            --no-progress
            --exclude 'fonts\.gstatic\.com'
            --exclude 'img\.shields\.io'
            --exclude 'gill-bates\.github\.io/fetchly'
            --exclude 'www\.gnu\.org/licenses/?'
            --exclude 'apps\.apple\.com'
            './site/**/*.html'
          fail: true

      - name: Upload artifact
        if: |
          github.ref == 'refs/heads/main' &&
          (
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'workflow_run'
          )
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    if: |
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'workflow_run'
      )
    needs:
      - build
      - security-scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  security-scan:
    needs: resolve
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # Trivy reports on what a manifest names, and the docs extra names its
      # direct dependencies only: mkdocs-material alone pulls in jinja2,
      # markupsafe, babel, requests, urllib3 and pygments. The frozen file from
      # the resolve job is the transitive set the build installs, so the scan
      # covers exactly that environment.
      - name: Download frozen docs environment
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: docs-requirements

      - name: Trivy scan docs dependencies
        # Pinned to an immutable commit SHA — see GHSA-69fq-xp46-6x23.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # As in docker-build.yml: the action's default scanner version trails
          # its own releases, and the database it reads is downloaded fresh on
          # every run regardless.
          version: 'latest'
          cache: 'false'
          scan-type: 'fs'
          scan-ref: 'docs-requirements-frozen.txt'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          timeout: '5m'
