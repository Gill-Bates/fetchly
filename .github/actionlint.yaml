#
# actionlint validates runs-on against a label list baked into the binary, and
# the Ubuntu 26.04 images are newer than the list in the released versions, so
# every job would be reported as an unknown runner label.
#
# These are GitHub-hosted labels, not self-hosted ones - this file only tells the
# linter they exist. Drop the entries once the pinned actionlint-py knows them
# (remove one and re-run the Workflow lint job).
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
